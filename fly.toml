app = "clash-royale-rl-coach"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  MODEL_PATH = "models/ppo_cr_best.zip"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
